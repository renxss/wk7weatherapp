<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css"/>
    <title>Renee's Weather App</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter a city.."
            required
            id="search-form-input"
            class="search-form-input"
          />

          <input
            type="submit"
            value="Search"
            class="search-form-button"
          />
        </form>
      </header>

      <main>
        <div class="weather-app-data">
          <div class="weather-app-details">
            <h1 class="weather-app-city" id="city">Sydney</h1>
            <p class="weather-app-description">
              Sunday 15:00, Mostly cloudy
              <br />
              Humidity: <strong>5%</strong>, Wind: <strong>2.2km/h</strong>
            </p>
          </div>

          <div class="weather-app-temperature-container">
            <div class="weather-app-icon">☁️</div>
            <div class="weather-app-temperature">23</div>
            <div class="weather-app-unit">°C</div>
          </div>
        </div>
      </main>

      <footer>
        This project was coded by
        <a href="https://github.com/renxss/wk7weatherapp" target="_blank">Renee Singh, open-sourced on Github </a>
        hosted <a href="https://wk7weatherapp.netlify.app/" target="_blank">Netlify</a>
      </footer>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
